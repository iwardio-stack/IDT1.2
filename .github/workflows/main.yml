
name: Build IDT APK

on:
  workflow_dispatch:
  push:
    branches:
      - main

jobs:
  build:
    name: Build IDT Android APK
    runs-on: ubuntu-latest

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Set up Java 17
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'

      - name: Configure Android SDK
        shell: bash
        run: |
          echo "ANDROID_HOME=$ANDROID_HOME"
          echo "ANDROID_SDK_ROOT=$ANDROID_SDK_ROOT"

          SDKMANAGER=$(find "$ANDROID_HOME" \
            -name sdkmanager \
            -type f 2>/dev/null | head -n 1)

          if [ -z "$SDKMANAGER" ]; then
            echo "ERROR: Android SDK manager not found"
            exit 1
          fi

          echo "SDK manager: $SDKMANAGER"
          echo "SDKMANAGER=$SDKMANAGER" >> "$GITHUB_ENV"

      - name: Install Android SDK packages
        shell: bash
        run: |
          bash "$SDKMANAGER" --licenses || true

          bash "$SDKMANAGER" \
            "platform-tools" \
            "platforms;android-35" \
            "build-tools;35.0.0"

      - name: Install Gradle 8.9
        shell: bash
        run: |
          wget -q \
            https://services.gradle.org/distributions/gradle-8.9-bin.zip

          unzip -q gradle-8.9-bin.zip

          echo "$PWD/gradle-8.9/bin" >> "$GITHUB_PATH"

          gradle --version

      - name: Find project ZIP
        shell: bash
        run: |
          ZIP_FILE=$(find . \
            -maxdepth 2 \
            -type f \
            -iname "*.zip" \
            | head -n 1)

          if [ -z "$ZIP_FILE" ]; then
            echo "ERROR: Project ZIP not found"
            exit 1
          fi

          echo "Found ZIP: $ZIP_FILE"
          echo "ZIP_FILE=$ZIP_FILE" >> "$GITHUB_ENV"

      - name: Extract project
        shell: bash
        run: |
          mkdir -p extracted-project
          unzip -q "$ZIP_FILE" -d extracted-project

          echo "Extracted project:"
          find extracted-project -maxdepth 4 -type f | head -n 100

      - name: Find Android project
        shell: bash
        run: |
          SETTINGS_FILE=$(find extracted-project \
            -type f \
            \( -name "settings.gradle" \
            -o -name "settings.gradle.kts" \) \
            | head -n 1)

          if [ -z "$SETTINGS_FILE" ]; then
            echo "ERROR: Android project files not found"
            find extracted-project -type f
            exit 1
          fi

          PROJECT_DIR=$(dirname "$SETTINGS_FILE")

          echo "Project directory: $PROJECT_DIR"
          echo "PROJECT_DIR=$PROJECT_DIR" >> "$GITHUB_ENV"

      - name: Build debug APK
        shell: bash
        run: |
          cd "$PROJECT_DIR"

          gradle assembleDebug \
            --no-daemon \
            --stacktrace

      - name: Find APK
        shell: bash
        run: |
          find "$PROJECT_DIR" \
            -type f \
            -name "*.apk" \
            -print

      - name: Upload APK
        uses: actions/upload-artifact@v4
        with:
          name: IDT-debug-APK
          path: |
            extracted-project/**/build/outputs/apk/**/*.apk
          if-no-files-found: error
