
name: Build IDT Android APK

on:
  workflow_dispatch:
  push:
    branches:
      - main

permissions:
  contents: read
  actions: write

jobs:
  build:
    name: Build IDT Android APK
    runs-on: ubuntu-latest

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Set up Java 17
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'

      - name: Set up Android SDK
        uses: android-actions/setup-android@v3

      - name: Install Android SDK packages
        run: |
          yes | sdkmanager --licenses || true
          sdkmanager "platform-tools" \
            "platforms;android-35" \
            "build-tools;35.0.0"

      - name: Install Gradle 8.9
        run: |
          wget -q https://services.gradle.org/distributions/gradle-8.9-bin.zip
          unzip -q gradle-8.9-bin.zip
          echo "$PWD/gradle-8.9/bin" >> "$GITHUB_PATH"

      - name: Find Android project
        run: |
          mkdir -p project
          ZIP_FILE=$(find . -type f -name "*.zip" | head -n 1)

          if [ -n "$ZIP_FILE" ]; then
            echo "Extracting: $ZIP_FILE"
            unzip -q "$ZIP_FILE" -d project
          else
            echo "No ZIP file found. Using repository files."
            cp -r . project/
          fi

      - name: Find project folder
        run: |
          SETTINGS_FILE=$(find project -type f \( -name "settings.gradle" -o -name "settings.gradle.kts" \) | head -n 1)

          if [ -z "$SETTINGS_FILE" ]; then
            echo "ERROR: Android project not found"
            exit 1
          fi

          PROJECT_FOLDER=$(dirname "$SETTINGS_FILE")
          echo "PROJECT_FOLDER=$PROJECT_FOLDER" >> "$GITHUB_ENV"
          echo "Android project found at: $PROJECT_FOLDER"

      - name: Build debug APK
        run: |
          cd "$PROJECT_FOLDER"

          gradle assembleDebug \
            --no-daemon \
            --stacktrace \
            -Pkotlin.jvm.target.validation.mode=warning

      - name: Find APK
        run: |
          APK_FILE=$(find "$PROJECT_FOLDER" -type f -name "*.apk" | head -n 1)

          if [ -z "$APK_FILE" ]; then
            echo "ERROR: APK was not created"
            exit 1
          fi

          echo "APK found: $APK_FILE"
          mkdir -p output
          cp "$APK_FILE" output/IDT-Installation-Signoff.apk

      - name: Upload APK
        uses: actions/upload-artifact@v4
        with:
          name: IDT-Installation-Signoff-APK
          path: output/IDT-Installation-Signoff.apk
          if-no-files-found: error
